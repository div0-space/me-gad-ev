[project]
name = "mock-course-mcp"
version = "0.1.0"
description = "Synthetic course practice API and MCP server"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "mcp>=1.30,<2",
  "httpx>=0.27,<1",
]

[tool.uv]
package = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
